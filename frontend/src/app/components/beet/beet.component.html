<div class="beet-container">
  <div class="image-grid">
    <div *ngFor="let rent of rentListe" class="image-cell">
      <div class="image-wrapper">
        <img class="pfanze-img" src="gepflanztePflanze.svg" alt="Gepflanzte Pflanze" [style.width]="berechneStadium(rent.created_at!, Number(rent.seed.growth_weeks))+'%'"/>
        <img class="beet-img" src="beetFeld.svg" alt="Beet Feld" />
      </div>
      <p><strong class="yorkten-bold">{{ rent.seed.dt_name }}</strong></p>
      <div class="give-back-button">
        <!--- Wachsende Pflanzen Übersicht, und Buttons --->
          <app-main-button ButtonText="Zurückschicken" (click)="giveBack(rent.rent_number)"></app-main-button>
      </div>
    </div>
  </div>
</div>
