<div class="card tile" [routerLink]="['/saatgut', seedId]" style="cursor: pointer;">
  <div class="card-image tile-image">
    <figure class="image is-4by3">
      <img src="szafran-1.jpg" alt="saatgut image" />
    </figure>
  </div>
  <div class="tile-content card-content">
    <p class="seed-title yorkten-regular">{{ seedTitle }}</p>
    <p class="seed-description yorkten-regular">{{ seedDescription }}</p>
    <p class="seed-category yorkten-light">{{ seedCategory }}</p>
  </div>
</div>
