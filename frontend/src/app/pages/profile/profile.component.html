              fill="#818f66"/>
      </svg>
      <app-flowerhead HeadlineText="Hallo {{ user.name }}" type="yorkten-demi"></app-flowerhead>
    </div>
  </div>

  <div class="pageLayout columns ">
    <div class="infoUser yorkten-demi column is-one-quarter is-flex is-align-items-center">
      <div class="obereInfo">
        <p>Benutzername: {{ user.name }}</p>
        <p>Email: {{ user.email }}</p>
        <hr>
        <p>Gerade angepflanzt: {{ plantedSeeds.length }}</p>
        <p>Erfolgreich zurückgegeben: {{ backSeeds.length }}</p>
      </div>
    </div>

    <div class="chartCentered column ">
      <div class="chartWrapper">
        <app-chart [userNumber]="user.user_number"></app-chart>
      </div>
    </div>
  </div>
</div>

<div *ngIf="!currentUser" class="has-text-centered py-6">
  <p class="yorkten-demi">Bitte melde dich an, um dein Profil zu sehen.</p>
</div>


<div class="HeadlineMoAnPf mb-6">
  <!--- 2te Blumen headline --->
  <app-flowerhead HeadlineText="Momentan angepflanzt" type="yorkten-demi"> </app-flowerhead>

  <div *ngIf="plantedSeeds.length > 0; else emptyGarden" class="">
    <app-beet [rentListe]="plantedSeeds"></app-beet>
  </div>

  <ng-template #emptyGarden>
    <div class="has-text-centered">
      <p class="profile-empty-garden yorkten-demi">Du hast noch nichts angepflanzt.</p>
    </div>
  </ng-template>
</div>

<div *ngIf="backSeeds.length > 0">
  <!--- 3te Blumen headline --->
  <app-flowerhead HeadlineText="Erfolgreich zurückgegeben" type="yorkten-demi"></app-flowerhead>

  <div class="seedTiles">
    <div class="sliderLeft">
      <app-next-button-slider direction="left" (clicked)="prevSlide()"></app-next-button-slider>
      <!--- mit click wird die Aktion ausgelöst --->
    </div>
    <div class="tiles" *ngFor="let rent of visibleSeeds">
      <!--- Tiles  --->
      <app-saatgut-tile [seedId]="rent.seed.seed_number" [seedTitle]="rent.seed.dt_name"
                        [seedDescription]="rent.seed.description"
                        [seedCategory]="rent.seed.category_names"></app-saatgut-tile>

    </div>
    <div class="sliderRight">
      <app-next-button-slider direction="right" (clicked)="nextSlide()"></app-next-button-slider>
    </div>
  </div>
</div>

<app-footer></app-footer>
