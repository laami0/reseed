<div class="columns is-7">

  <div class="column is-three-fifths">
    <div class="back-button-container">
      <app-backbutton [theme]="'light'"></app-backbutton>
    </div>
    <div class="panel-background left-panel">
      <app-flowerhead class="chauncy flower-edge" [layout]="'vertical'"></app-flowerhead>
    </div>
  </div>

  <div class="column login-form">
    <div class="yorkten-demi login-title mb-2">Anmelden</div>

    <form class="login-form-elements" (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="field">
        <app-textfield
          label="Benutzername/Email"
          type="text"
          placeholder="z.B. max@example.com"
          length="short"
          (valueChange)="user.email = $event"
        ></app-textfield>
      </div>

      <div class="field">
        <app-textfield
          label="Passwort"
          type="password"
          placeholder="********"
          length="short"
          (valueChange)="user.password = $event"
        ></app-textfield>
      </div>

      <div class="forgot-password-link">
        <a href="/login">Passwort vergessen?</a>
      </div>

      <div *ngIf="errorMessage" class="notification is-danger">
        <p>{{ errorMessage }}</p>
      </div>

      <div class="field login-form-button">
        <app-main-button ButtonText="Anmelden"></app-main-button>
      </div>

      <p class="has-text-centered mt-4">
        Du hast noch kein Account?
        <a href="/register">Jetzt registrieren</a>
      </p>
    </form>

  </div>

</div>
